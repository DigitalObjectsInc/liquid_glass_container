name: liquid_glass_container
description: >-
  Liquid glass container widget with real refraction, dispersion, fresnel,
  glare, backdrop blur and shadow. Fast single-pass shader, all platforms
  including web.
version: 0.1.0
repository: https://github.com/DigitalObjectsInc/liquid_glass_container
issue_tracker: https://github.com/DigitalObjectsInc/liquid_glass_container/issues
topics:
  - liquid-glass
  - glassmorphism
  - shader
  - ui
  - widget

screenshots:
  - description: >-
      Liquid glass panes over a wallpaper: refraction, glare, backdrop blur,
      and glass stacked on glass.
    path: doc/hero.png
  - description: >-
      Crisp refraction with chromatic dispersion beside a frosted, tinted
      pane.
    path: doc/refraction.png

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - lib/shaders/glass_main.frag
    - lib/shaders/glass_overlay.frag
